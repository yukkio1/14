<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi persona favorita ❤️</title>
    <style>
        :root {
            --color-env: #ff4d6d;
            --color-env2: #ff758f;
            --color-letter: #fff9ec;
            --color-bg-inicial: #ffb3c1;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Georgia', serif;
            overflow: hidden;
            background-color: var(--color-bg-inicial);
            background-size: cover;
            background-position: center;
            transition: all 1.5s ease-in-out;
        }

        body.night-mode {
            background-image: url('fondo2.jpg');
            background-color: #050a18;
        }

        /* SOBRE Y CARTA (SIEMPRE AL CENTRO) */
        .container {
            position: relative;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.5s;
        }

        .envelope {
            position: relative;
            width: 280px;
            height: 180px;
            background-color: var(--color-env);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            z-index: 10;
            border: 2px solid #d4af37;
        }

        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            z-index: 12;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 90px solid var(--color-env2);
            transform-origin: top;
            transition: transform 0.6s ease-in-out;
        }

        .letter {
            position: absolute;
            bottom: 10px;
            left: 5%;
            width: 90%;
            height: 95%;
            background: var(--color-letter);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            transition: all 0.8s ease-in-out;
            z-index: 5;
            border-radius: 5px;
            opacity: 0;
            border: 6px double #ff758f;
            outline: 2px solid #d4af37;
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
        }

        .container.open .envelope::before { transform: rotateX(180deg); z-index: 1; }
        .container.open .letter { 
            transform: translateY(-160px); 
            opacity: 1; 
            z-index: 15; 
        }

        /* DECORACIONES (RAMOS Y FOTOS) */
        .decoration {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 30vw; /* Ancho basado en la pantalla */
            max-width: 400px;
            min-width: 150px;
            opacity: 0;
            transition: all 1.2s ease-in-out;
            pointer-events: none;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        .left-side { left: 2vw; align-items: flex-end; }
        .right-side { right: 2vw; align-items: flex-start; }

        .container.open ~ .decoration { opacity: 1; }

        .branch-img {
            position: absolute;
            width: 100%;
            height: 110%;
            object-fit: contain;
            z-index: -1;
        }

        .mini-photo {
            width: 80px;
            height: 80px;
            border: 3px solid white;
            border-radius: 5px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            margin: 5px;
            z-index: 51;
        }

        /* Zigzag */
        .left-side .mini-photo:nth-child(odd) { transform: rotate(-5deg) translateX(-10px); }
        .left-side .mini-photo:nth-child(even) { transform: rotate(5deg) translateX(5px); }
        .right-side .mini-photo:nth-child(odd) { transform: rotate(5deg) translateX(10px); }
        .right-side .mini-photo:nth-child(even) { transform: rotate(-5deg) translateX(-5px); }

        /* AJUSTES PARA CELULAR (PANTALLAS PEQUEÑAS) */
        @media (max-width: 600px) {
            .decoration { width: 120px; min-width: 100px; }
            .left-side { left: -10px; } /* Se pegan un poco más al borde para que no tapen el centro */
            .right-side { right: -10px; }
            .mini-photo { width: 65px; height: 65px; }
            .container.open { transform: scale(0.85) translateY(50px); } /* Achica el sobre para que quepa todo */
        }

        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 10; 
            animation: floatUp 3.5s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="loveMusic" src="music.mp3"></audio>

    <div class="container" onclick="openLetter(this)">
        <div class="envelope"></div>
        <div class="letter">
            <p><strong>¡Vámonos a Marte!</strong></p>
            <p>Donde nadie nos busque... ✨</p>
            <p>Feliz 14 de Febrero.</p>
            <img src="https://cdn-icons-png.flaticon.com/512/833/833472.png" width="20">
        </div>
    </div>

    <div class="decoration left-side">
        <img src="izquierda.jpg" class="branch-img">
        <img src="foto1.jpg" class="mini-photo">
        <img src="foto2.jpg" class="mini-photo">
        <img src="foto3.jpg" class="mini-photo">
        <img src="foto4.jpg" class="mini-photo">
    </div>

    <div class="decoration right-side">
        <img src="derecha.jpg" class="branch-img">
        <img src="foto5.jpg" class="mini-photo">
        <img src="foto6.jpg" class="mini-photo">
        <img src="foto7.jpg" class="mini-photo">
        <img src="foto8.jpg" class="mini-photo">
    </div>

    <script>
        function openLetter(container) {
            const music = document.getElementById('loveMusic');
            container.classList.toggle('open');
            
            if (container.classList.contains('open')) {
                document.body.classList.add('night-mode');
                music.play().catch(e => console.log("Interacción requerida"));
                for (let i = 0; i < 35; i++) { setTimeout(createParticle, i * 120); }
            } else {
                document.body.classList.remove('night-mode');
                music.pause();
                music.currentTime = 0;
            }
        }

        function createParticle() {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = ['❤️', '✨', '🌸', '💖'][Math.floor(Math.random() * 4)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '5%';
            p.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 4000);
        }
    </script>
</body>
</html>
