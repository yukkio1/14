<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi persona favorita ❤️</title>
    <style>
        :root {
            --color-env: #ff4d6d;
            --color-env2: #ff758f;
            --color-letter: #fff9ec;
            --color-bg-inicial: #ffb3c1;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
            background-color: var(--color-bg-inicial);
            background-size: cover;
            background-position: center;
            transition: all 1.5s ease-in-out;
            position: relative;
        }

        body.night-mode {
            background-image: url('fondo2.jpg');
            background-color: #050a18;
        }

        /* Contenedor Principal Adaptable */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            position: relative;
            padding: 20px;
            gap: 20px;
        }

        /* SOBRE */
        .container {
            position: relative;
            cursor: pointer;
            z-index: 100;
            flex-shrink: 0;
        }

        .envelope {
            position: relative;
            width: 280px; /* Tamaño un poco más pequeño para móviles */
            height: 180px;
            background-color: var(--color-env);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            z-index: 10;
            border: 2px solid #d4af37;
        }

        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            z-index: 12;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 90px solid var(--color-env2);
            transform-origin: top;
            transition: transform 0.6s ease-in-out;
        }

        .letter {
            position: absolute;
            bottom: 10px;
            left: 5%;
            width: 90%;
            height: 95%;
            background: var(--color-letter);
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            transition: all 0.8s ease-in-out;
            z-index: 5;
            border-radius: 5px;
            opacity: 0;
            border: 6px double #ff758f;
            outline: 2px solid #d4af37;
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
        }

        .container.open .envelope::before { transform: rotateX(180deg); z-index: 1; }
        .container.open .letter { 
            transform: translateY(-130px); 
            opacity: 1; 
            z-index: 15; 
        }

        /* DECORACIONES (RAMOS Y FOTOS) */
        .decoration {
            width: 150px; /* Más estrecho para que quepa en móviles */
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
            z-index: 50;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container.open ~ .decoration { opacity: 1; }

        .branch-img {
            position: absolute;
            width: 250px;
            height: auto;
            z-index: -1;
            top: 50%;
            transform: translateY(-50%);
        }

        .left-side .branch-img { right: -50px; }
        .right-side .branch-img { left: -50px; }

        .mini-photo {
            width: 70px; /* Fotos más pequeñas para móviles */
            height: 70px;
            border: 3px solid white;
            border-radius: 5px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            margin: 5px;
            z-index: 51;
        }

        /* RESPONSIVE: AJUSTE PARA MÓVILES */
        @media (max-width: 768px) {
            .main-wrapper {
                flex-direction: column; /* Apila Ramos arriba/abajo del sobre si es muy angosto */
                padding-top: 150px;
            }
            .decoration {
                width: 100%;
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
            }
            .branch-img {
                width: 180px;
                top: 0;
                transform: none;
            }
            .container.open .letter {
                transform: translateY(-110px);
                font-size: 0.8rem;
            }
            .envelope { width: 220px; height: 140px; }
            .envelope::before { border-left-width: 110px; border-right-width: 110px; border-top-width: 70px; }
        }

        /* PARTÍCULAS */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 10; 
            animation: floatUp 3.5s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-80vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="loveMusic" src="music.mp3"></audio>

    <div class="main-wrapper">
        <div class="decoration left-side">
            <img src="izquierda.jpg" class="branch-img">
            <img src="foto1.jpg" class="mini-photo">
            <img src="foto2.jpg" class="mini-photo">
            <img src="foto3.jpg" class="mini-photo">
            <img src="foto4.jpg" class="mini-photo">
        </div>

        <div class="container" onclick="openLetter(this)">
            <div class="envelope"></div>
            <div class="letter">
                <p><strong>¡Vámonos a Marte!</strong></p>
                <p>Donde nadie nos busque... ✨</p>
                <p>Feliz 14 de febrero.</p>
                <img src="https://cdn-icons-png.flaticon.com/512/833/833472.png" width="20">
            </div>
        </div>

        <div class="decoration right-side">
            <img src="derecha.jpg" class="branch-img">
            <img src="foto5.jpg" class="mini-photo">
            <img src="foto6.jpg" class="mini-photo">
            <img src="foto7.jpg" class="mini-photo">
            <img src="foto8.jpg" class="mini-photo">
        </div>
    </div>

    <script>
        function openLetter(container) {
            const music = document.getElementById('loveMusic');
            container.classList.toggle('open');
            
            if (container.classList.contains('open')) {
                document.body.classList.add('night-mode');
                music.play();
                for (let i = 0; i < 30; i++) { setTimeout(createParticle, i * 150); }
            } else {
                document.body.classList.remove('night-mode');
                music.pause();
                music.currentTime = 0;
            }
        }

        function createParticle() {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = ['❤️', '✨', '🌸', '💖'][Math.floor(Math.random() * 4)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '10%';
            p.style.fontSize = (Math.random() * 15 + 10) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 4000);
        }
    </script>
</body>
</html>
