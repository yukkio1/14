<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi persona favorita ❤️</title>
    <style>
        :root {
            --color-env: #ff4d6d;
            --color-env2: #ff758f;
            --color-letter: #fff9ec;
            --color-bg-inicial: #ffb3c1;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Georgia', serif;
            overflow: hidden;
            background-color: var(--color-bg-inicial);
            background-size: cover;
            background-position: center;
            transition: all 1.5s ease-in-out;
        }

        body.night-mode {
            background-image: url('fondo2.jpg');
            background-color: #050a18;
        }

        .scene {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* SOBRE CENTRAL */
        .container {
            position: relative;
            cursor: pointer;
            z-index: 100;
        }

        .envelope {
            width: 280px;
            height: 180px;
            background-color: var(--color-env);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            z-index: 10;
            border: 2px solid #d4af37;
        }

        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 90px solid var(--color-env2);
            transform-origin: top;
            transition: transform 0.6s ease-in-out;
            z-index: 12;
        }

        .letter {
            position: absolute;
            bottom: 10px;
            left: 5%;
            width: 90%;
            height: 95%;
            background: var(--color-letter);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            transition: all 0.8s ease-in-out;
            z-index: 5;
            border-radius: 5px;
            opacity: 0;
            border: 6px double #ff758f;
            outline: 2px solid #d4af37;
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
        }

        .container.open .envelope::before { transform: rotateX(180deg); z-index: 1; }
        .container.open .letter { transform: translateY(-160px); opacity: 1; z-index: 15; }

        /* DECORACIONES LATERALES */
        .decoration {
            position: absolute;
            width: 300px;
            height: 550px;
            opacity: 0;
            transition: all 1.2s ease-in-out;
            pointer-events: none;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Empujamos las fotos más hacia afuera del centro */
        .left-side { right: 60%; align-items: flex-end; }
        .right-side { left: 60%; align-items: flex-start; }

        .container.open ~ .decoration { opacity: 1; }

        .branch-img {
            position: absolute;
            width: 380px;
            height: 100%;
            object-fit: contain;
            z-index: -1;
        }

        .left-side .branch-img { right: -80px; }
        .right-side .branch-img { left: -80px; }

        .mini-photo {
            width: 95px;
            height: 95px;
            border: 4px solid white;
            border-radius: 2px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 51;
        }

        /* Posiciones laterales estratégicas */
        .left-side .mini-photo:nth-child(2) { transform: rotate(-12deg) translateX(-35px); }
        .left-side .mini-photo:nth-child(3) { transform: rotate(8deg) translateX(15px); }
        .left-side .mini-photo:nth-child(4) { transform: rotate(-18deg) translateX(-45px); }
        .left-side .mini-photo:nth-child(5) { transform: rotate(10deg) translateX(10px); }

        .right-side .mini-photo:nth-child(2) { transform: rotate(12deg) translateX(35px); }
        .right-side .mini-photo:nth-child(3) { transform: rotate(-8deg) translateX(-15px); }
        .right-side .mini-photo:nth-child(4) { transform: rotate(18deg) translateX(45px); }
        .right-side .mini-photo:nth-child(5) { transform: rotate(-10deg) translateX(-10px); }

        /* OPTIMIZACIÓN MÓVIL (S23 ULTRA) */
        @media (max-width: 600px) {
            .envelope { width: 180px; height: 120px; }
            .envelope::before { border-left-width: 90px; border-right-width: 90px; border-top-width: 60px; }
            .decoration { width: 130px; height: 420px; }
            .mini-photo { width: 68px; height: 68px; }
            .left-side { right: 54%; }
            .right-side { left: 54%; }
            .container.open .letter { transform: translateY(-125px); font-size: 0.85rem; }
            /* Suavizamos el movimiento en móvil para que no se corten */
            .left-side .mini-photo { transform: rotate(-6deg) translateX(-15px) !important; }
            .right-side .mini-photo { transform: rotate(6deg) translateX(15px) !important; }
        }

        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 200; 
            animation: floatUp 3.5s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="loveMusic" src="music.mp3"></audio>

    <div class="scene">
        <div class="container" onclick="openLetter(this)">
            <div class="envelope"></div>
            <div class="letter">
                <p><strong>¡Vámonos a Marte!</strong></p>
                <p>Donde nadie nos busque... ✨</p>
                <p>Feliz 14 de Febrero.</p>
                <img src="https://cdn-icons-png.flaticon.com/512/833/833472.png" width="20">
            </div>
        </div>

        <div class="decoration left-side">
            <img src="izquierda.png" class="branch-img">
            <img src="foto1.jpg" class="mini-photo">
            <img src="foto2.jpg" class="mini-photo">
            <img src="foto3.jpg" class="mini-photo">
            <img src="foto4.jpg" class="mini-photo">
        </div>

        <div class="decoration right-side">
            <img src="derecha.png" class="branch-img">
            <img src="foto5.jpg" class="mini-photo">
            <img src="foto6.jpg" class="mini-photo">
            <img src="foto7.jpg" class="mini-photo">
            <img src="foto8.jpg" class="mini-photo">
        </div>
    </div>

    <script>
        function openLetter(container) {
            const music = document.getElementById('loveMusic');
            container.classList.toggle('open');
            
            if (container.classList.contains('open')) {
                document.body.classList.add('night-mode');
                music.play().catch(e => console.log("Audio block active"));
                for (let i = 0; i < 30; i++) { setTimeout(createParticle, i * 150); }
            } else {
                document.body.classList.remove('night-mode');
                music.pause();
                music.currentTime = 0;
            }
        }

        function createParticle() {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = ['❤️', '✨', '🌸', '💖'][Math.floor(Math.random() * 4)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '10%';
            p.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 4000);
        }
    </script>
</body>
</html>
